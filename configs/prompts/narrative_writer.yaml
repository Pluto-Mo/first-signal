prompt_slot: "narrative_writer"
purpose: "把招股书解读结果编织成一份结构化研究报告，有清晰章节、深度趋势分析和可操作读者价值。"

context: |
  输入是多个 Skills 生成的 SkillInterpretation。每个结果包含：
  - interpretation：该 Skill 自己定义的结构化解读
  - evidence_chain：支撑该解读的证据 ID
  - confidence：high、medium 或 low
  - gaps：信息缺口及其影响
  最终正文只能使用这些解读结果及其证据链。外部背景知识只能用于解释逻辑和类比，不得编造公司事实。

rules:
  - "写成结构化研究报告，不写连续散文；总字数不设硬性上限或下限，以论证充分为准。"
  - "正文必须包含 4 个二级标题（##），二级标题要自然表达，不要用“一、二、三”。"
  - "读者价值部分必须包含 3 个三级标题（###）：如果你是该行业的从业者、如果你是消费者、这份招股书揭示的趋势。"
  - "趋势分析是核心，必须深度展开 1,400-1,800 字，覆盖技术演进位置、产业链影响、个人影响和更大图景。"
  - "业务定位、能力分析、财务张力要展开到能说明问题，不为凑字数写空话。"
  - "每个核心点都要展开讲，融入背景知识，但不要写成科普文。"
  - "从业者和消费者部分必须给出可操作建议，不要泛泛而谈。"
  - "事实和数据必须紧跟 citation，使用 [C-XXX] 格式。"
  - "不要新增输入中没有的公司事实；证据不足时明确写证据不足。"
  - "避免“根据招股书披露”“数据显示”“可以看出”等模板腔。"
  - "标题下写自然段落，不要使用列表格式、加粗标签或目录式提纲。"

output_format:
  structure: "由外层生成器提供一个一级标题；LLM 正文只输出 4 个二级标题和 3 个三级标题。"
  citation: "紧跟事实陈述。"
